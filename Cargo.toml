[package]
name = "ytfast"
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
description = "A lean native YouTube Music menu-bar player for macOS with a retained Rust desktop build for Linux"
license = "MIT"
authors = ["Tyler Mayberry"]
repository = "https://github.com/Xon333/ytfast-macos"
publish = false

[dependencies]
# Keep the upstream UI and renderer pins; no WebView or browser engine.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "persistence"] , optional = true }
egui = { version = "0.36", optional = true }
egui_extras = { version = "0.36", features = ["image", "svg"] , optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] , optional = true }
# All fastframe crates, including the native tray, use the upstream tag.
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" , optional = true }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" , optional = true }
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" , optional = true }
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" , optional = true }
fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" , optional = true }
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
fastrand = "2"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "net", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "brotli"] }
# A single SQLite build also works when targeting the other Mac architecture.
rusqlite = { version = "0.37", features = ["bundled"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wayland", "x11"] , optional = true }
# Keep AccessKit and the Linux integrations on the same async-io reactor.
zbus = { version = "5", default-features = false, features = ["async-io"] , optional = true }
ksni = { version = "0.3", default-features = false, features = ["async-io"] , optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
fastframe-tray = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" , optional = true }

[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "ytfast"
path = "src/main.rs"
required-features = ["desktop-ui"]

[features]
default = ["desktop-ui"]
desktop-ui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:image", "dep:fastframe-fonts", "dep:fastframe-icons", "dep:fastframe-text", "dep:fastframe-theme", "dep:fastframe-shell", "dep:fastframe-tray", "dep:zbus", "dep:ksni"]
menubar = []
e2e = ["desktop-ui"]

[patch.crates-io]
# Unchanged upstream pins, aligned with fastframe v0.2.2.
ecolor = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
eframe = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79"  }
egui = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79"  }
egui-wgpu = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79"  }
egui_glow = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
emath = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
epaint = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
winit = { git = "https://github.com/crmne/winit", rev = "544a73716c7a54c916d97d6c86c0b1bdaa81234e" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
