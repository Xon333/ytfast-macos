name: Apply bounded native correction
on:
  push:
    branches: [feat/compact-oled-20261008]
    paths: [.native-correction.patch, .github/workflows/apply-native-correction.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Xon333/ytfast-macos' && github.ref == 'refs/heads/feat/compact-oled-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact checked patch and pinned formatting
        run: |
          set -euo pipefail
          echo '28b006f0309cb231bb1b2802fb7102c62ae80755e9bd2d299dcd395277ab0b61  .native-correction.patch' | sha256sum -c -
          git apply --check .native-correction.patch
          git apply .native-correction.patch
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all
          git diff --check
          git rm .native-correction.patch .github/workflows/apply-native-correction.yml
          git add native/PlayerPanel.swift src/backend/mod.rs src/backend/playback.rs docs/MACOS.md
          test "$(git ls-remote origin refs/heads/feat/compact-oled-20261008 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use supported AppKit traits and retain bounded selection ownership'
          git push origin HEAD:refs/heads/feat/compact-oled-20261008
          git rev-parse HEAD HEAD^{tree}
