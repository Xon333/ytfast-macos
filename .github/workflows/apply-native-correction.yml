name: Apply bounded native correction
on:
  push:
    branches: [feat/compact-oled-20261008]
    paths: [.native-correction.patch, .github/workflows/apply-native-correction.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Xon333/ytfast-macos' && github.ref == 'refs/heads/feat/compact-oled-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply the visual-review correction and remove its transport
        run: |
          set -euo pipefail
          echo '7a26c6c71107ad9080721691f2e72fdface33af52bcd0e7d2b778def090af723  .native-correction.patch' | sha256sum -c -
          git apply --check .native-correction.patch
          git apply .native-correction.patch
          git diff --check
          git rm .native-correction.patch .github/workflows/apply-native-correction.yml
          git add native/Controls.swift native/SelfTest.swift
          test "$(git ls-remote origin refs/heads/feat/compact-oled-20261008 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve disabled-control contrast and capture explicit shuffle state'
          git push origin HEAD:refs/heads/feat/compact-oled-20261008
          git rev-parse HEAD HEAD^{tree}
