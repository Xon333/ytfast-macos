name: Native checks
on:
  push:
    branches: [main, port/macos, perf/menubar]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: never
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: runner.os == 'macOS'
        name: Native AppKit typecheck
        run: xcrun swiftc -swift-version 5 -typecheck -import-objc-header native/Bridge.h native/*.swift
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy && rustup default 1.98.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-1.98-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-1.98-
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev
      - if: runner.os == 'macOS'
        run: brew install mpv yt-dlp deno
      - name: Memory probe measurement and IPC checks
        run: python3 -B -m unittest discover -s scripts -p 'test_probe_mpv_memory.py'
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --no-default-features --features menubar --lib -- -D warnings
      - run: cargo test --locked --release --no-default-features --features menubar --lib
      - if: runner.os == 'Linux'
        name: Retained desktop UI
        run: |
          cargo clippy --locked --all-targets --features e2e -- -D warnings
          cargo test --locked --release --features e2e --lib
      - if: runner.os == 'macOS'
        name: Renderer-free dependency check and audio transport
        run: |
          ! cargo tree --locked --no-default-features --features menubar -e normal | grep -E '(egui|eframe|wgpu|winit|fastframe-fonts) v'
          cargo test --locked --release --no-default-features --features menubar --lib native_audio_transport -- --ignored --nocapture
          cargo test --locked --release --no-default-features --features menubar --lib ytdlp_audio_selection_matches_source_quality_and_language -- --ignored --nocapture
          cargo test --locked --release --no-default-features --features menubar --lib snapshot_serialization -- --ignored --nocapture
          scripts/build-macos.sh
          scripts/smoke-macos.sh
      - if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ytfast-native-arm64
          path: |
            dist/ytfast-macos-arm64.zip
            artifacts/native/
          if-no-files-found: error
