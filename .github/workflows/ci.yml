name: Native checks
on:
  push:
    branches: [main, port/macos]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy && rustup default 1.98.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-1.98-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-1.98-${{ hashFiles('Cargo.lock') }}-
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev
      - if: runner.os == 'macOS'
        run: brew install cmake mpv yt-dlp deno
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --features e2e -- -D warnings
      - run: cargo test --locked --release --features e2e
      - run: cargo run --locked --release -- --help
      - if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin
          CARGO_BUILD_TARGET=aarch64-apple-darwin scripts/build-macos.sh
      - if: runner.os == 'macOS'
        name: Native window and CLI smoke test (signed out)
        run: scripts/smoke-macos.sh
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ytfast-macos-arm64
          path: dist/ytfast-macos-arm64.zip
          if-no-files-found: error
